{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found | City Cycle</title>

    <!-- <link rel="icon" href="{% static 'images/favicon.png' %}"> -->

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            overflow: hidden;
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        /* Background Glow */

        body::before {
            content: '';
            position: absolute;
            width: 450px;
            height: 450px;
            border-radius: 50%;
            background: #00d4ff33;
            filter: blur(90px);
            top: -120px;
            left: -120px;
            animation: float 8s ease-in-out infinite;
        }

        body::after {
            content: '';
            position: absolute;
            width: 350px;
            height: 350px;
            border-radius: 50%;
            background: #00ffb333;
            filter: blur(90px);
            right: -100px;
            bottom: -100px;
            animation: float 10s ease-in-out infinite reverse;
        }

        @keyframes float {
            50% {
                transform: translateY(40px);
            }
        }

        .card404 {

            width: 700px;
            max-width: 90%;
            padding: 50px;
            border-radius: 25px;
            text-align: center;

            background: rgba(255, 255, 255, .08);
            border: 1px solid rgba(255, 255, 255, .18);

            backdrop-filter: blur(15px);

            box-shadow: 0 20px 60px rgba(0, 0, 0, .4);

            animation: fadeIn 1s;
            z-index: 5;

        }

        @keyframes fadeIn {

            from {

                transform: translateY(30px);
                opacity: 0;

            }

            to {

                transform: translateY(0);
                opacity: 1;

            }

        }

        .bike {

            font-size: 95px;
            color: #00e5ff;

            animation: ride 2s ease-in-out infinite;

            margin-bottom: 20px;

        }

        @keyframes ride {

            0%,
            100% {

                transform: translateX(-10px);

            }

            50% {

                transform: translateX(10px);

            }

        }

        .error {

            font-size: 130px;
            font-weight: 900;
            color: #fff;
            line-height: 1;

            text-shadow: 0 0 30px rgba(0, 229, 255, .5);

        }

        h2 {

            color: white;
            margin-top: 10px;
            font-weight: 700;

        }

        p {

            color: #d9d9d9;
            font-size: 18px;
            margin-top: 15px;

        }

        .btn-home {

            display: inline-block;
            margin-top: 35px;
            padding: 14px 40px;
            border-radius: 50px;

            background: #00d4ff;
            color: white;
            text-decoration: none;

            font-weight: 600;

            transition: .35s;

        }

        .btn-home:hover {

            background: #00b8d4;
            color: white;
            transform: translateY(-4px);

            box-shadow: 0 15px 30px rgba(0, 212, 255, .4);

        }

        .road {

            position: absolute;
            bottom: 0;
            left: 0;

            width: 200%;
            height: 10px;

            background: repeating-linear-gradient(to right,
                    white 0,
                    white 40px,
                    transparent 40px,
                    transparent 80px);

            animation: road 2s linear infinite;

            opacity: .6;

        }

        @keyframes road {

            from {

                transform: translateX(0);

            }

            to {

                transform: translateX(-80px);

            }

        }

        .circle {

            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, .05);
            animation: move 15s linear infinite;

        }

        @keyframes move {

            from {

                transform: translateY(0);

            }

            to {

                transform: translateY(-1200px);

            }

        }
    </style>

</head>

<body>

    <div class="circle" style="width:120px;height:120px;left:8%;bottom:-150px;"></div>
    <div class="circle" style="width:70px;height:70px;left:25%;bottom:-120px;animation-duration:12s;"></div>
    <div class="circle" style="width:90px;height:90px;left:75%;bottom:-130px;animation-duration:18s;"></div>
    <div class="circle" style="width:50px;height:50px;left:90%;bottom:-100px;animation-duration:10s;"></div>

    <div class="card404">

        <div class="bike">
            <i class="fa-solid fa-bicycle"></i>
        </div>

        <div class="error">
            404
        </div>

        <h2>Oops! Wrong Route</h2>

        <p>
            Looks like this cycle has taken a wrong turn.<br>
            The page you're looking for doesn't exist.
        </p>

        <a href="/" class="btn-home">
            <i class="fa-solid fa-house me-2"></i>
            Ride Back Home
        </a>

    </div>

    <div class="road"></div>

</body>

</html>
